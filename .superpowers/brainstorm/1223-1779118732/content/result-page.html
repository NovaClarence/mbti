<style>
  .result-container {
    font-family: system-ui, sans-serif;
  }
  .type-hero {
    text-align: center;
    padding: 24px;
    background: linear-gradient(135deg, #667eea11, #764ba211);
    border-radius: 16px;
    margin-bottom: 20px;
  }
  .type-badge {
    display: inline-block;
    font-size: 48px;
    font-weight: 800;
    letter-spacing: 4px;
    color: #667eea;
    padding: 12px 32px;
    border: 3px solid #667eea;
    border-radius: 16px;
  }
  .type-name {
    font-size: 18px;
    color: #666;
    margin-top: 8px;
  }
  .confidence-tag {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    margin-top: 10px;
  }
  .confidence-tag.high { background: #2ecc7120; color: #27ae60; }
  .confidence-tag.medium { background: #f39c1220; color: #e67e22; }
  .confidence-tag.low { background: #e74c3c20; color: #c0392b; }

  .dim-bars {
    margin-bottom: 20px;
  }
  .dim-row {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    gap: 10px;
  }
  .dim-label {
    width: 30px;
    font-weight: 700;
    font-size: 16px;
    color: #1a1a2e;
    text-align: center;
  }
  .dim-bar-wrap {
    flex: 1;
    display: flex;
    height: 28px;
    border-radius: 6px;
    overflow: hidden;
  }
  .dim-bar-left {
    background: #e0e0e0;
    transition: width 0.5s;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 6px;
    font-size: 12px;
    font-weight: 600;
  }
  .dim-bar-right {
    background: #667eea;
    transition: width 0.5s;
    display: flex;
    align-items: center;
    padding-left: 6px;
    font-size: 12px;
    color: white;
    font-weight: 600;
  }
  .dim-right-label {
    width: 30px;
    font-weight: 700;
    font-size: 16px;
    color: #764ba2;
    text-align: center;
  }

  .radar-placeholder {
    text-align: center;
    padding: 32px;
    background: #f8f9ff;
    border-radius: 12px;
    margin-bottom: 20px;
    font-size: 14px;
    color: #888;
  }

  .action-btns {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  .btn {
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
  }
  .btn-primary { background: #667eea; color: white; }
  .btn-outline { background: white; color: #667eea; border: 2px solid #667eea; }

  </div>
</div>
